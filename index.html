
<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              sans: ['"Raleway"', 'sans-serif'],
              display: ['"Cinzel"', 'serif'],
              mono: ['"Fira Code"', 'monospace'],
            },
            colors: {
              paper: {
                50: '#fdfcf9',
                100: '#f9f7f1',
                200: '#f2efe6',
                300: '#e6e0d2',
                400: '#d4cbb8',
                500: '#b8a98f',
                600: '#9a8a6e',
                700: '#7d6f56',
                800: '#5c5546',
                900: '#3d382e'
              },
              ink: {
                50: '#f7f8fa',
                100: '#e8eaef',
                200: '#c9cdd6',
                300: '#a0a7b5',
                400: '#6b7280',
                500: '#4a5568',
                600: '#3d4556',
                700: '#2d3748',
                800: '#1a202c',
                900: '#0f1419',
                950: '#080b0f'
              },
              gold: {
                50: '#fffdf0',
                100: '#fff8d6',
                200: '#ffee96',
                300: '#f2dd6f',
                400: '#e6c84d',
                500: '#d4af37',
                600: '#b8942a',
                700: '#96771f',
                800: '#745b17',
                900: '#523f10'
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
              'elevator': 'elevator 5s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' },
              },
              elevator: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for that vintage feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f2efe6;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #2d3748;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #718096;
      }

      /* CRT Scanline Effect */
      .scanlines::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 2;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      /* Vignette */
      .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: 0 0 150px rgba(0,0,0,0.7) inset;
        pointer-events: none;
        z-index: 3;
      }
      
      /* Text Glow */
      .text-glow {
        text-shadow: 0 0 5px rgba(197, 160, 40, 0.5);
      }

      /* Increase base font size by ~20% for better readability */
      html {
        font-size: 19px !important;
      }

      /* Override small text classes to be more readable */
      .text-xs {
        font-size: 0.8rem !important;
        line-height: 1.25rem;
      }
      .text-sm {
        font-size: 0.925rem !important;
        line-height: 1.4rem;
      }
      .text-base {
        font-size: 1.05rem !important;
        line-height: 1.6rem;
      }
      .text-lg {
        font-size: 1.2rem !important;
        line-height: 1.85rem;
      }
    </style>
